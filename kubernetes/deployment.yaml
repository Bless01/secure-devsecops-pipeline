apiVersion: apps/v1
kind: Deployment
metadata:
  name: student-portal
  namespace: student-portal
  labels:
    app: student-portal
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: student-portal
  template:
    metadata:
      labels:
        app: student-portal
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: student-portal
          image: student-portal@sha256:8dc27df21d24411ce2f5cf396308d43b2f9b5375545989ecde78f36a008e26b4
          imagePullPolicy: Always
          ports:
            - name: http
              containerPort: 5000
          securityContext:
            allowPrivilegeEscalation: true
            privileged: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
          resources:
            requests:
              cpu: "100m"
              memory: "128Mi"
            limits:
              cpu: "500m"
              memory: "256Mi"
          readinessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 15
            periodSeconds: 20
          volumeMounts:
            - name: portal-data
              mountPath: /portal/instance
            - name: portal-config
              mountPath: /portal/instance/config.py
              subPath: config.py
              readOnly: true
            - name: temporary-files
              mountPath: /tmp
      volumes:
        - name: portal-data
          persistentVolumeClaim:
            claimName: portal-data
        - name: portal-config
          secret:
            secretName: student-portal-secrets
            defaultMode: 0440
            items:
              - key: config.py
                path: config.py
        - name: temporary-files
          emptyDir:
            sizeLimit: 64Mi