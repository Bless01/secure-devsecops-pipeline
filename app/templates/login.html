<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Student Login | Blessings University</title>

    <link
        rel="stylesheet"
        href="{{ url_for('static', filename='style.css') }}"
    >
</head>

<body>
    <header class="navbar">
        <div class="brand">Blessings University</div>

        <nav>
            <a href="{{ url_for('main.home') }}">Home</a>
            <a href="{{ url_for('main.login') }}">Student Login</a>
        </nav>
    </header>

    <main class="container">
        <section class="login-card">
            <span class="status">Student access</span>

            <h1>Student Login</h1>

            <p>
                Enter your university account information to access your
                grades and student profile.
            </p>

            <form
                class="login-form"
                method="POST"
                action="{{ url_for('main.login') }}"
            >
                <div class="form-group">
                    <label for="username">Student ID or Email</label>

                    <input
                        id="username"
                        name="username"
                        type="text"
                        placeholder="Enter your student ID or email"
                        autocomplete="username"
                        required
                    >
                </div>

                <div class="form-group">
                    <label for="password">Password</label>

                    <input
                        id="password"
                        name="password"
                        type="password"
                        placeholder="Enter your password"
                        autocomplete="current-password"
                        required
                    >
                </div>

                <button class="button" type="submit">
                    Sign In
                </button>
            </form>

            <p class="login-note">
                Contact the university support desk if you need assistance
                accessing your account.
            </p>
        </section>
    </main>

    <footer>
        &copy; 2026 Blessings University. All rights reserved.
    </footer>
</body>
</html>
